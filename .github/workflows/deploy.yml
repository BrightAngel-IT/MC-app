name: Deploy Backend to cPanel via FTP

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.BACKEND_FTP_SERVER }}
        username: ${{ secrets.BACKEND_FTP_USERNAME }}
        password: ${{ secrets.BACKEND_FTP_PASSWORD }}
        protocol: ftp
        port: 21
        timeout: 60000
        local-dir: ./backend/
        server-dir: ./
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.env*
          **/public/uploads/**
          **/.agents/**
          **/.claude/**
          **/.windsurf/**
          **/*.d.ts
          **/prisma/generated/client/*.node
          **/prisma/generated/client/*.dll.node
          **/prisma/generated/client/*.wasm
          **/error.log
          **/*.log
          **/test*.js
          **/deletePatients.js
          **/fix_backend.js
          **/migrate_order.js
          **/patch_*.js
