name: Deploy Frontend to Hostinger via FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 4. Export Web App Bundle
        working-directory: ./frontend
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: 1
        run: |
          npx expo export -p web
          # Ensure index.html and SPA .htaccess are present
          cp -f dist/index.html dist/200.html 2>/dev/null || true

          # Create a dedicated fonts directory and copy all vector icon fonts
          mkdir -p dist/fonts
          cp -rf node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/* dist/fonts/ 2>/dev/null || true

          # Also replicate the node_modules path inside dist/assets in case Metro runtime queries it
          mkdir -p dist/assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/
          cp -rf node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/* dist/assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/ 2>/dev/null || true

          # If expo export created hashed font files inside dist/assets, copy unhashed ones too
          find dist/assets -name "*.ttf" -exec cp -f {} dist/fonts/ \; 2>/dev/null || true
          # Find any MaterialCommunityIcons hash requested and duplicate into it
          node -e '
            const fs = require("fs");
            const path = require("path");
            const targetDir = "dist/assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts";
            if (fs.existsSync(targetDir)) {
              const src = path.join(targetDir, "MaterialCommunityIcons.ttf");
              if (fs.existsSync(src)) {
                // copy to common hash name seen in web bundle
                fs.copyFileSync(src, path.join(targetDir, "MaterialCommunityIcons.6e435534bd35da5fef04168860a9b8fa.ttf"));
              }
            }
          '

          # Inject CSS @font-face rules into index.html so browser loads icons universally
          node -e '
            const fs = require("fs");
            const fontCss = `
            <style id="expo-vector-icons">
              @font-face { font-family: "Ionicons"; src: url("/fonts/Ionicons.ttf") format("truetype"); }
              @font-face { font-family: "ionicons"; src: url("/fonts/Ionicons.ttf") format("truetype"); }
              @font-face { font-family: "MaterialIcons"; src: url("/fonts/MaterialIcons.ttf") format("truetype"); }
              @font-face { font-family: "Material Icons"; src: url("/fonts/MaterialIcons.ttf") format("truetype"); }
              @font-face { font-family: "material"; src: url("/fonts/MaterialIcons.ttf") format("truetype"); }
              @font-face { font-family: "MaterialCommunityIcons"; src: url("/fonts/MaterialCommunityIcons.ttf") format("truetype"); }
              @font-face { font-family: "Material Design Icons"; src: url("/fonts/MaterialCommunityIcons.ttf") format("truetype"); }
              @font-face { font-family: "material-community"; src: url("/fonts/MaterialCommunityIcons.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome"; src: url("/fonts/FontAwesome.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome5Free-Regular"; src: url("/fonts/FontAwesome5_Regular.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome5Free-Solid"; src: url("/fonts/FontAwesome5_Solid.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome5Brands-Regular"; src: url("/fonts/FontAwesome5_Brands.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome5_Regular"; src: url("/fonts/FontAwesome5_Regular.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome5_Solid"; src: url("/fonts/FontAwesome5_Solid.ttf") format("truetype"); }
              @font-face { font-family: "FontAwesome5_Brands"; src: url("/fonts/FontAwesome5_Brands.ttf") format("truetype"); }
              @font-face { font-family: "Feather"; src: url("/fonts/Feather.ttf") format("truetype"); }
              @font-face { font-family: "feather"; src: url("/fonts/Feather.ttf") format("truetype"); }
              @font-face { font-family: "AntDesign"; src: url("/fonts/AntDesign.ttf") format("truetype"); }
              @font-face { font-family: "anticon"; src: url("/fonts/AntDesign.ttf") format("truetype"); }
              @font-face { font-family: "Entypo"; src: url("/fonts/Entypo.ttf") format("truetype"); }
              @font-face { font-family: "entypo"; src: url("/fonts/Entypo.ttf") format("truetype"); }
              @font-face { font-family: "Octicons"; src: url("/fonts/Octicons.ttf") format("truetype"); }
              @font-face { font-family: "octicons"; src: url("/fonts/Octicons.ttf") format("truetype"); }
            </style>
            `;
            let html = fs.readFileSync("dist/index.html", "utf8");
            html = html.replace("</head>", fontCss + "</head>");
            fs.writeFileSync("dist/index.html", html);
            if (fs.existsSync("dist/200.html")) {
              fs.writeFileSync("dist/200.html", html);
            }
          '

      - name: 5. Create .htaccess for Single Page App (SPA) Routing & Fonts
        working-directory: ./frontend/dist
        run: |
          cat << 'EOF' > .htaccess
          Options -MultiViews
          <IfModule mod_headers.c>
            <FilesMatch "\.(ttf|ttc|otf|eot|woff|woff2|font.css|css|js|json|png|jpg|jpeg|gif|ico|svg)$">
              Header set Access-Control-Allow-Origin "*"
            </FilesMatch>
          </IfModule>
          <IfModule mod_mime.c>
            AddType font/ttf .ttf
            AddType font/woff .woff
            AddType font/woff2 .woff2
            AddType application/font-woff .woff
            AddType application/font-woff2 .woff2
            AddType application/javascript .js
            AddType text/css .css
          </IfModule>
          <IfModule mod_rewrite.c>
            RewriteEngine On
            # Do not rewrite if request is for existing file or directory
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Do not rewrite assets, fonts or _expo paths
            RewriteRule ^assets/ - [L]
            RewriteRule ^fonts/ - [L]
            RewriteRule ^_expo/ - [L]

            # Everything else goes to index.html for Single Page Application
            RewriteRule ^ index.html [L]
          </IfModule>
          EOF

      - name: 6. Sync Build Files to Hostinger Subdomain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 60000
          local-dir: ./frontend/dist/
          server-dir: ./
          dangerous-clean-slate: false
